<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!--
    First-pass enemy: a raider seen from above, facing right, in the same style and pose as the soldier,
    drawn at 400 px per world unit with the center at (256, 256). One sprite: body, weapon and head
    together (it doesn't need a separate weapon layer yet). Legs come from legs_walk.png.
    Weapon: a generic rifle with wood furniture, butt at (316, 304), muzzle at (960, 304).
  -->
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d463b"/>
      <stop offset="1" stop-color="#55291f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3218"/>
      <stop offset="0.35" stop-color="#9a6236"/>
      <stop offset="0.6" stop-color="#7c4a26"/>
      <stop offset="1" stop-color="#4a2812"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17181a"/>
      <stop offset="0.4" stop-color="#5a5d63"/>
      <stop offset="0.55" stop-color="#414449"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
    <radialGradient id="beanie" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#46464b"/>
      <stop offset="1" stop-color="#1f1f22"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d2a785"/>
      <stop offset="1" stop-color="#9c7354"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="6" dy="9" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="smallShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Arms in the jacket's sleeves. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262,392 L390,432 L498,336" stroke="#2b1612" stroke-width="66"/>
      <path d="M262,392 L390,432" stroke="url(#jacket)" stroke-width="60"/>
      <path d="M390,432 L498,336" stroke="url(#jacket)" stroke-width="50"/>
      <path d="M262,122 L460,180 L690,276" stroke="#2b1612" stroke-width="66"/>
      <path d="M262,122 L460,180" stroke="url(#jacket)" stroke-width="60"/>
      <path d="M460,180 L690,276" stroke="url(#jacket)" stroke-width="50"/>
      <path d="M268,378 L388,416 L478,338 M268,108 L458,164 L672,254" stroke="#a5685a" stroke-width="9" opacity="0.35"/>
    </g>

    <!-- Shoulders in the jacket, and a chest rig with three magazine pouches. -->
    <ellipse cx="256" cy="256" rx="90" ry="168" fill="url(#jacket)" stroke="#2b1612" stroke-width="4"/>
    <rect x="198" y="150" width="140" height="212" rx="30" fill="#3f4232" stroke="#24261c" stroke-width="4"/>
    <path d="M206,180 H330 M206,332 H330" stroke="#2c2e22" stroke-width="10" stroke-linecap="round"/>
    <rect x="326" y="196" width="28" height="36" rx="6" fill="#4a4d3b" stroke="#24261c" stroke-width="3"/>
    <rect x="326" y="238" width="28" height="36" rx="6" fill="#4a4d3b" stroke="#24261c" stroke-width="3"/>
    <rect x="326" y="280" width="28" height="36" rx="6" fill="#4a4d3b" stroke="#24261c" stroke-width="3"/>

    <!-- Scarf wrapped around the neck. -->
    <ellipse cx="276" cy="276" rx="78" ry="74" fill="#b3a27e" stroke="#7a6b4e" stroke-width="3"/>
    <ellipse cx="276" cy="276" rx="78" ry="74" fill="none" stroke="#8a2f2a" stroke-width="2" stroke-dasharray="8 8" opacity="0.7"/>
  </g>

  <!-- The rifle, under the head and hands. -->
  <g filter="url(#smallShadow)">
    <path d="M326,289 L472,293 L472,315 L326,319 Q316,319 316,309 L316,299 Q316,289 326,289 Z" fill="url(#wood)"/>
    <rect x="316" y="289" width="6" height="30" rx="2" fill="#2a1a0e"/>
    <rect x="470" y="291" width="172" height="26" rx="3" fill="url(#steel)"/>
    <path d="M500,296 H600 M500,312 H600" stroke="#6a6e75" stroke-width="1.2" opacity="0.6"/>
    <rect x="600" y="316" width="16" height="10" rx="3" fill="url(#steel)" stroke="#0f1011" stroke-width="1"/>
    <rect x="640" y="294" width="16" height="20" rx="2" fill="#2a2c30" stroke="#0f1011" stroke-width="1"/>
    <rect x="656" y="289" width="126" height="30" rx="6" fill="url(#wood)"/>
    <path d="M670,295 H770 M670,313 H770" stroke="#3a1f0c" stroke-width="2" opacity="0.7"/>
    <rect x="650" y="298" width="140" height="12" rx="5" fill="#4a2a14"/>
    <rect x="780" y="299" width="152" height="10" rx="3" fill="url(#steel)"/>
    <rect x="880" y="295" width="20" height="18" rx="3" fill="url(#steel)" stroke="#0f1011" stroke-width="1"/>
    <path d="M928,297 L958,299 L958,309 L928,311 Z" fill="url(#steel)" stroke="#0f1011" stroke-width="1"/>
  </g>

  <!-- Head in a knit beanie, leaning toward the stock; hands in fingerless gloves. -->
  <g filter="url(#shadow)">
    <ellipse cx="284" cy="282" rx="70" ry="64" fill="url(#beanie)" stroke="#121214" stroke-width="3"/>
    <ellipse cx="284" cy="282" rx="52" ry="47" fill="none" stroke="#2a2a2e" stroke-width="3"/>
    <ellipse cx="284" cy="282" rx="34" ry="30" fill="none" stroke="#2a2a2e" stroke-width="3"/>
    <circle cx="282" cy="280" r="14" fill="#3a3a3f" stroke="#121214" stroke-width="2"/>
    <path d="M342,262 Q356,282 342,302" stroke="#9c7354" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="520" cy="326" rx="28" ry="19" fill="#26241f" stroke="#141311" stroke-width="2.5"/>
    <path d="M540,320 L566,318" stroke="url(#skin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M506,334 H536" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="718" cy="286" rx="30" ry="20" fill="#26241f" stroke="#141311" stroke-width="2.5"/>
    <path d="M734,294 L768,300" stroke="url(#skin)" stroke-width="11" stroke-linecap="round"/>
    <path d="M708,318 H740" stroke="url(#skin)" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
