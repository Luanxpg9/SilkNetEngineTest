<svg xmlns="http://www.w3.org/2000/svg" width="896" height="512" viewBox="0 0 896 512">
  <!--
    The soldier seen from above, facing right (+X), drawn at 400 px per world unit.
    This is the bottom half of the figure: backpack, shoulders, plate carrier, and both arms reaching
    forward to the rifle. The rifle (rifle.svg) is drawn on top of it, then soldier_top.svg (helmet
    and gloves) on top of the rifle, all three lined up on the same point:
      soldier center: (256, 256)   rifle butt: (320, 304)   right hand: (552, 324)   left hand: (742, 288)
    The soldier's right side is the bottom of the image.
  -->
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8368"/>
      <stop offset="1" stop-color="#5c624c"/>
    </linearGradient>
    <radialGradient id="carrier" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9a8560"/>
      <stop offset="1" stop-color="#6e5d40"/>
    </radialGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f5038"/>
      <stop offset="1" stop-color="#7c6a4b"/>
    </linearGradient>
    <!-- Camouflage blotches, clipped to the sleeves. -->
    <pattern id="camo" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <path d="M10,20 q20,-14 38,2 q10,16 -8,24 q-24,6 -30,-26z" fill="#4f5541" opacity="0.55"/>
      <path d="M70,60 q22,-8 34,10 q4,18 -18,20 q-22,-2 -16,-30z" fill="#8a9174" opacity="0.45"/>
      <path d="M20,84 q16,-6 22,8 q-2,14 -16,10 q-10,-6 -6,-18z" fill="#4f5541" opacity="0.5"/>
      <path d="M86,8 q12,0 14,12 q-6,10 -16,4 q-4,-10 2,-16z" fill="#3f4434" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="6" dy="9" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Radio antenna, from the pouch on the back-left of the carrier. -->
    <path d="M198,156 Q152,124 114,98" stroke="#1d1e1c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="114" cy="98" r="5" fill="#1d1e1c"/>

    <!-- Hydration carrier on the back. -->
    <rect x="146" y="166" width="58" height="180" rx="22" fill="url(#pack)" stroke="#45392a" stroke-width="3"/>
    <path d="M160,180 V332" stroke="#4a3e2c" stroke-width="3" stroke-dasharray="6 5"/>
    <rect x="152" y="236" width="14" height="40" rx="5" fill="#4a3e2c"/>

    <!-- Right arm (bottom): shoulder to elbow, elbow to the pistol grip. Outline first, then sleeve, then camo and a highlight. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262,392 L396,432 L526,336" stroke="#2e3226" stroke-width="66"/>
      <path d="M262,392 L396,432" stroke="url(#sleeve)" stroke-width="60"/>
      <path d="M396,432 L526,336" stroke="url(#sleeve)" stroke-width="50"/>
      <path d="M262,392 L396,432" stroke="url(#camo)" stroke-width="60"/>
      <path d="M396,432 L526,336" stroke="url(#camo)" stroke-width="50"/>
      <path d="M268,378 L394,416 L504,338" stroke="#a3ab8c" stroke-width="9" opacity="0.35"/>
      <!-- Elbow pad. -->
      <ellipse cx="396" cy="432" rx="27" ry="23" fill="#3d4233" stroke="none"/>
      <ellipse cx="392" cy="426" rx="16" ry="11" fill="#545a46" stroke="none"/>
    </g>

    <!-- Left arm (top): reaches far forward to the handguard. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262,122 L480,178 L708,278" stroke="#2e3226" stroke-width="66"/>
      <path d="M262,122 L480,178" stroke="url(#sleeve)" stroke-width="60"/>
      <path d="M480,178 L708,278" stroke="url(#sleeve)" stroke-width="50"/>
      <path d="M262,122 L480,178" stroke="url(#camo)" stroke-width="60"/>
      <path d="M480,178 L708,278" stroke="url(#camo)" stroke-width="50"/>
      <path d="M268,108 L478,162 L690,256" stroke="#a3ab8c" stroke-width="9" opacity="0.35"/>
      <ellipse cx="480" cy="178" rx="27" ry="23" fill="#3d4233" stroke="none"/>
      <ellipse cx="476" cy="172" rx="16" ry="11" fill="#545a46" stroke="none"/>
    </g>

    <!-- Shoulders. -->
    <ellipse cx="256" cy="256" rx="92" ry="172" fill="url(#sleeve)" stroke="#2e3226" stroke-width="4"/>
    <ellipse cx="256" cy="256" rx="92" ry="172" fill="url(#camo)"/>

    <!-- Plate carrier: back plate, front plate, the shoulder straps joining them, cummerbund edges. -->
    <rect x="180" y="128" width="158" height="256" rx="40" fill="url(#carrier)" stroke="#4d412d" stroke-width="4"/>
    <rect x="202" y="148" width="114" height="216" rx="28" fill="#6a5a3e"/>
    <rect x="180" y="144" width="158" height="38" rx="14" fill="#8c7853" stroke="#4d412d" stroke-width="3"/>
    <rect x="180" y="330" width="158" height="38" rx="14" fill="#8c7853" stroke="#4d412d" stroke-width="3"/>
    <path d="M188,163 H330 M188,349 H330" stroke="#5a4b33" stroke-width="2" stroke-dasharray="7 5"/>

    <!-- MOLLE webbing rows along the front plate's top edge, and three magazine pouches. -->
    <path d="M318,190 V322 M326,190 V322" stroke="#5a4b33" stroke-width="2"/>
    <rect x="330" y="186" width="30" height="40" rx="7" fill="#83704d" stroke="#4d412d" stroke-width="3"/>
    <rect x="330" y="232" width="30" height="40" rx="7" fill="#83704d" stroke="#4d412d" stroke-width="3"/>
    <rect x="330" y="278" width="30" height="40" rx="7" fill="#83704d" stroke="#4d412d" stroke-width="3"/>
    <path d="M338,194 V218 M338,240 V264 M338,286 V310" stroke="#a08b64" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Radio pouch on the back-left. -->
    <rect x="188" y="144" width="30" height="34" rx="6" fill="#5f5038" stroke="#45392a" stroke-width="2"/>

    <!-- Collar of the shirt, at the neck (mostly hidden by the helmet). -->
    <ellipse cx="270" cy="270" rx="58" ry="66" fill="#5c624c" stroke="#3d4233" stroke-width="3"/>
  </g>
</svg>
