<svg xmlns="http://www.w3.org/2000/svg" width="896" height="512" viewBox="0 0 896 512">
  <!--
    The top half of the soldier: helmet and gloves. Drawn on top of the rifle, so the helmet sits
    over the stock (cheek against it) and the fingers wrap over the grip and the handguard.
    Same canvas and center as soldier_base.svg: soldier center (256, 256), facing right.
  -->
  <defs>
    <radialGradient id="helmet" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#6e765b"/>
      <stop offset="0.65" stop-color="#525a43"/>
      <stop offset="1" stop-color="#363c2c"/>
    </radialGradient>
    <radialGradient id="glove" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4c4842"/>
      <stop offset="1" stop-color="#26241f"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e40"/>
      <stop offset="1" stop-color="#1c1e1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Helmet, leaning toward the rifle for the cheek weld. -->
  <g filter="url(#shadow)">
    <!-- Hearing protection cups, sticking out under the helmet's sides. -->
    <ellipse cx="298" cy="200" rx="26" ry="14" fill="url(#cup)" stroke="#111" stroke-width="2"/>
    <ellipse cx="298" cy="364" rx="26" ry="14" fill="url(#cup)" stroke="#111" stroke-width="2"/>

    <ellipse cx="286" cy="282" rx="92" ry="84" fill="url(#helmet)" stroke="#2a2f22" stroke-width="4"/>

    <!-- Side rails (accessory rails along both sides). -->
    <path d="M228,222 Q286,202 344,222" stroke="#25281f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M228,222 Q286,202 344,222" stroke="#4a4f40" stroke-width="10" fill="none" stroke-dasharray="3 5"/>
    <path d="M228,342 Q286,362 344,342" stroke="#25281f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M228,342 Q286,362 344,342" stroke="#4a4f40" stroke-width="10" fill="none" stroke-dasharray="3 5"/>

    <!-- Bungee cord around the shell. -->
    <ellipse cx="286" cy="282" rx="70" ry="62" fill="none" stroke="#2c3024" stroke-width="3.5" stroke-dasharray="16 7"/>

    <!-- Counterweight pouch at the back. -->
    <rect x="194" y="250" width="28" height="64" rx="9" fill="#7d6b4c" stroke="#4d412d" stroke-width="3"/>
    <path d="M202,258 V306" stroke="#5a4b33" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- Velcro patch with an IR identification square. -->
    <rect x="262" y="262" width="46" height="30" rx="5" fill="#4b5240"/>
    <rect x="292" y="268" width="11" height="11" rx="2" fill="#2f3328"/>

    <!-- Night-vision mount at the front. -->
    <rect x="360" y="262" width="20" height="40" rx="6" fill="#2a2c2e" stroke="#111" stroke-width="2"/>
    <circle cx="370" cy="271" r="2.5" fill="#555"/>
    <circle cx="370" cy="293" r="2.5" fill="#555"/>

    <!-- Shine on the shell. -->
    <ellipse cx="252" cy="238" rx="44" ry="26" fill="#ffffff" opacity="0.13" filter="url(#soft)"/>
  </g>

  <!-- Right glove on the pistol grip, index finger resting along the trigger guard. -->
  <g filter="url(#shadow)">
    <rect x="514" y="318" width="16" height="36" rx="6" fill="#1c1b19" transform="rotate(-42 522 336)"/>
    <ellipse cx="552" cy="326" rx="32" ry="21" fill="url(#glove)" stroke="#141311" stroke-width="2.5"/>
    <path d="M574,318 L604,316" stroke="#3a3732" stroke-width="11" stroke-linecap="round"/>
    <path d="M574,318 L604,316" stroke="#141311" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <rect x="534" y="330" width="34" height="10" rx="4" fill="#1c1b19"/>
    <path d="M540,330 V340 M550,330 V340 M560,330 V340" stroke="#3b3833" stroke-width="1.5"/>
  </g>

  <!-- Left glove on the handguard: thumb along the top, fingertips showing on the far side. -->
  <g filter="url(#shadow)">
    <rect x="698" y="260" width="16" height="36" rx="6" fill="#1c1b19" transform="rotate(-66 706 278)"/>
    <ellipse cx="742" cy="286" rx="32" ry="21" fill="url(#glove)" stroke="#141311" stroke-width="2.5"/>
    <path d="M758,294 L796,300" stroke="#3a3732" stroke-width="12" stroke-linecap="round"/>
    <path d="M758,294 L796,300" stroke="#141311" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <g fill="#33302b" stroke="#141311" stroke-width="2">
      <rect x="730" y="318" width="11" height="12" rx="5"/>
      <rect x="744" y="319" width="11" height="12" rx="5"/>
      <rect x="758" y="319" width="11" height="11" rx="5"/>
    </g>
    <rect x="724" y="270" width="30" height="10" rx="4" fill="#1c1b19"/>
    <path d="M730,270 V280 M740,270 V280 M750,270 V280" stroke="#3b3833" stroke-width="1.5"/>
  </g>
</svg>
